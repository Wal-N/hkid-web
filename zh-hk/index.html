<!doctype html>
<html lang="zh-HK">
<head>
  <script type="module" src="/hkid-web/analytics.js" data-google-tag-src="https://www.googletagmanager.com/gtm.js?id=GTM-MTSLZZ7V"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#3d6aaf">
  <title>香港身份證號碼驗證及生成器</title>
  <meta name="description" content="生成完整香港身份證測試資料，包括號碼、姓名及出生日期。亦可在瀏覽器內安全檢查號碼格式及校驗碼，毋須上傳號碼。">
  <link rel="canonical" href="https://wal-n.github.io/hkid-web/zh-hk/">
  <link rel="alternate" hreflang="en" href="https://wal-n.github.io/hkid-web/">
  <link rel="alternate" hreflang="zh-HK" href="https://wal-n.github.io/hkid-web/zh-hk/">
  <link rel="alternate" hreflang="x-default" href="https://wal-n.github.io/hkid-web/">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/hkid-web/styles.css">
  <script type="module" src="/hkid-web/app.js"></script>
</head>
<body data-mode="generate">
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-github" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></symbol>
    <symbol id="icon-card" viewBox="0 0 24 24"><rect x="2" y="4.5" width="20" height="15" rx="3"/><path d="M5.5 10h13m-13 4.5h6"/></symbol>
    <symbol id="icon-generate" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path stroke-width="3" d="M8 8h.01M12 12h.01M16 16h.01"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-language" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="7.5" width="12" height="13.5" rx="2.5"/><path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 8a8.5 8.5 0 1 0 .2 8M20 3v5h-5"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5.5" y="10" width="13" height="11" rx="2.5"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3m-3.5 5v2"/></symbol>
    <symbol id="icon-cross" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9h.01"/></symbol>
    <symbol id="icon-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/></symbol>
    <symbol id="icon-warn" viewBox="0 0 24 24"><path d="m10.5 4-8 14A1.5 1.5 0 0 0 4 20h16a1.5 1.5 0 0 0 1.5-2l-8-14a1.7 1.7 0 0 0-3 0Z"/><path d="M12 9v4m0 3h.01"/></symbol>
  </svg>

  <div class="tool-backdrop">
    <div class="status-bar-edge" aria-hidden="true"></div>
    <header class="toolbar layout">
      <div class="brand" aria-label="HKID">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-card"/></svg></span>
        <span>HKID</span>
      </div>
      <div class="tabs" role="tablist" aria-label="工具">
        <button type="button" role="tab" class="tab" id="tab-generate" aria-controls="panel-generate" aria-selected="true" tabindex="0">
          <span class="tab-face"><svg class="icon" aria-hidden="true"><use href="#icon-generate"/></svg><span data-i18n="generate">生成</span></span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-validate" aria-controls="panel-validate" aria-selected="false" tabindex="-1">
          <span class="tab-face"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><span data-i18n="validate">驗證</span></span>
        </button>
      </div>
      <a id="locale-switch" class="locale glass-button" href="/hkid-web/" lang="en" hreflang="en" aria-label="Switch to English">
        <svg class="icon" aria-hidden="true"><use href="#icon-language"/></svg><span data-i18n="language">English</span>
      </a>
    </header>

    <main class="layout">
      <div id="tool-card" class="surface">
        <section id="panel-generate" role="tabpanel" aria-labelledby="tab-generate">
          <h1 data-i18n="sample">香港身份證資料範例</h1>
          <div id="generate-status" class="generate-status">
            <noscript><p>請啟用 JavaScript 以生成或驗證香港身份證號碼。</p></noscript>
            <div id="core-status" class="core-status" role="status" hidden>
              <span id="core-message" data-i18n="loading">載入中…</span>
              <button id="retry-core" class="action" type="button" hidden><span data-i18n="retry">再試</span></button>
            </div>
            <p id="copy-hint" hidden data-i18n="tapToCopy">點按資料即可複製</p>
          </div>
          <div id="sample-content" inert>
            <button type="button" class="number-card" data-copy="number">
              <span class="field-label" data-i18n="number">身份證號碼</span>
              <span class="number-value" data-value data-nosnippet></span>
              <svg class="icon copy-icon" aria-hidden="true"><use href="#icon-copy"/></svg>
              <span class="copy-feedback" aria-hidden="true" hidden></span>
            </button>

            <div class="field-grid">
              <button type="button" class="field" data-copy="chineseName">
                <span class="field-label" data-i18n="chineseName">中文姓名</span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="englishName">
                <span class="field-label" data-i18n="englishName">英文姓名</span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="birthDate">
                <span class="field-label"><span data-i18n="birthDate">出生日期</span><span data-format="dd-mm-yyyy">（dd-mm-yyyy）</span></span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="sex">
                <span class="field-label" data-i18n="sex">性別</span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="commercialCodes">
                <span class="field-label" data-i18n="commercialCodes">中文電碼</span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="symbols">
                <span class="field-label" data-i18n="symbols">證件符號</span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="firstRegistration">
                <span class="field-label"><span data-i18n="firstRegistration">首次登記年月</span><span data-format="mm-yy">（mm-yy）</span></span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
              <button type="button" class="field" data-copy="registrationDate">
                <span class="field-label"><span data-i18n="registrationDate">登記日期</span><span data-format="dd-mm-yy">（dd-mm-yy）</span></span>
                <span class="field-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
              </button>
            </div>

            <button type="button" class="summary" data-copy="summary">
              <span class="field-label" data-i18n="summary">持有人摘要</span>
              <svg class="icon copy-icon" aria-hidden="true"><use href="#icon-copy"/></svg>
              <span class="summary-value" data-value data-nosnippet></span><span class="copy-feedback" aria-hidden="true" hidden></span>
            </button>
            <p class="notice" data-i18n="notice">範例資料只供測試。生成資料可能與他人的真實身份證相同。</p>
            <div class="generate-actions">
              <button type="button" class="action glass-button" id="regenerate" disabled>
                <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg><span data-i18n="regenerate">再生成</span>
              </button>
            </div>
          </div>
        </section>

        <section class="validation-panel" id="panel-validate" role="tabpanel" aria-labelledby="tab-validate" hidden>
          <form id="validation-form" novalidate autocomplete="off">
            <h1><label for="number-input" data-i18n="enterNumber">輸入香港身份證號碼</label></h1>
            <div id="validate-status"></div>
            <div class="input-wrap">
              <input id="number-input" type="text" placeholder="例如 A123456(3)" spellcheck="false" autocapitalize="characters" autocomplete="off">
              <button type="button" id="clear-input" class="clear-input" aria-label="清除號碼" hidden>
                <svg class="icon" aria-hidden="true"><use href="#icon-cross"/></svg>
              </button>
            </div>
            <div class="validation-actions">
              <button id="check-number" type="submit" class="action glass-button" disabled>
                <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><span data-i18n="check">驗證</span>
              </button>
              <span class="on-device"><svg class="icon" aria-hidden="true"><use href="#icon-lock"/></svg><span data-i18n="onDevice">本機驗證，號碼不會上傳</span></span>
            </div>
          </form>
          <div class="result-column">
            <div id="validation-result" class="result" hidden>
              <span class="result-mark" aria-hidden="true">
                <svg class="icon result-info"><use href="#icon-info"/></svg>
                <svg class="icon result-done"><use href="#icon-done"/></svg>
                <svg class="icon result-warn"><use href="#icon-warn"/></svg>
              </span>
              <div><h2 id="result-title"></h2><p id="result-detail" hidden></p></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="site-stats layout">
    <p class="stats-totals" id="stats-totals">
      <span id="stats-visitors" data-i18n="visitorsPending">累計訪客 — 人</span>
      <span class="stats-separator" aria-hidden="true">·</span>
      <span id="stats-generated" data-i18n="generatedPending">已生成 — 筆 HKID</span>
      <span class="stats-meta">
        <span aria-hidden="true">|</span>
        <a class="github-link" href="https://github.com/Wal-N/hkid-web">
          <svg width="16" height="16" fill="currentColor" aria-hidden="true"><use href="#icon-github"/></svg>
          <span data-i18n="feedbackLink">建議及問題回報</span>
        </a>
      </span>
    </p>
    <details id="privacy">
      <summary data-i18n="privacy">私隱及用量統計</summary>
      <div class="privacy-body">
      <p data-i18n="privacyLocal">你輸入的身份證號碼及生成的樣本資料只會保留在你的瀏覽器內，並不會上傳。</p>
      <p data-i18n="privacyAnalytics">本網站使用 Google Analytics 4 統計網頁瀏覽次數和樣本生成次數。Google 可能會使用 Cookie 估算訪客人數。</p>
        <p><a href="https://policies.google.com/technologies/partner-sites" data-i18n="privacyLink">Google 如何使用來自合作夥伴網站的資料</a></p>
      </div>
    </details>
  </footer>
  <div id="live-feedback" class="sr-only" role="status" aria-atomic="true"></div>
</body>
</html>
